[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchside"
version = "0.2.0"
description = "Synthetic football match events to explainable, personalized match intelligence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.22",
    "agent-framework-openai>=1.17",
    "aiohttp>=3.9",
    "azure-ai-projects>=2.7",
    "azure-identity>=1.26",
    "mcp>=1.24,<2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mini-racer>=0.14.1",
    "pytest>=8",
]

[project.scripts]
pitchside = "pitchside.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pitchside = ["agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
