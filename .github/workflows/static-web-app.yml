name: Static Web App

# Publishes web/ (the UI and the recorded run bundles in web/data) to Azure Static Web Apps (Free plan).
# Manual only (Actions > Static Web App > Run workflow): pushes never redeploy, so freezing main after the
# submission tag cannot change the live demo, and the last deployment stays up until the resource group is deleted.
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN (the site's deployment token, docs/AZURE.md step 9).
# No Node.js: the files are already built, so the app build is skipped (Static Web Apps build configuration docs).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5

      - name: Check the published data before it goes live
        run: |
          uv sync --python 3.12
          uv run pytest -q tests/test_render_demo_data.py tests/test_web_static.py tests/test_web_js.py

      - name: Deploy web/ to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          api_location: ""
          output_location: ""
          skip_app_build: true
