name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python ${{ matrix.python-version }}
      - name: Test
        run: uv run pytest -q
      - name: Schema is up to date
        run: |
          uv run pitchside schema > /tmp/event.schema.json
          diff -u docs/event.schema.json /tmp/event.schema.json
          uv run pitchside schema --findings > /tmp/finding.schema.json
          diff -u docs/finding.schema.json /tmp/finding.schema.json
          uv run pitchside schema --bundle > /tmp/run_bundle.schema.json
          diff -u docs/run_bundle.schema.json /tmp/run_bundle.schema.json
          uv run pitchside schema --overlay > /tmp/overlay.schema.json
          diff -u docs/overlay.schema.json /tmp/overlay.schema.json

  e2e:
    # Browser end-to-end tests of the web UI. Non-blocking: a browser hiccup must not fail the build,
    # but a failure is visible on the run and its Playwright traces are uploaded.
    name: e2e (Chromium, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.12
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: End-to-end tests
        run: uv run pytest -m e2e -q --tracing retain-on-failure --output test-results
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results
          retention-days: 7
